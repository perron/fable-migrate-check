[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fable-migrate-check"
version = "0.1.0"
description = "Scan code for Messages API usage that breaks or changes when moving to Claude Fable 5.2."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Karl Perron"}]
keywords = ["ai", "claude", "fable", "migration", "anthropic", "cli"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Environment :: Console",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/perron/fable-migrate-check"
Repository = "https://github.com/perron/fable-migrate-check"
Issues = "https://github.com/perron/fable-migrate-check/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fable-migrate-check = "fable_migrate_check.cli:main"

[tool.setuptools.packages.find]
include = ["fable_migrate_check*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
